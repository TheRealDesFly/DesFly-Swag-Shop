name: iSend Poller - Inventory

on:
  schedule:
    - cron: '0 0,12 * * *' # twice daily at midnight and noon UTC
  workflow_dispatch: {}

jobs:
  trigger-inventory-poller:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger inventory poller
        env:
          SITE_URL: ${{ secrets['WIX_SITE_BASE_URL'] }}
          POLLER_SECRET: ${{ secrets['ISEND_POLLER_TRIGGER_SECRET'] }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$POLLER_SECRET" ]; then
            echo "Missing SITE_URL or POLLER_SECRET secrets";
            exit 1;
          fi
          echo "Calling poller for inventory..."
          curl -s -X POST "$SITE_URL/_functions/runISendPoller" \
            -H "Content-Type: application/json" \
            -H "X-ISEND-POLLER-SECRET: $POLLER_SECRET" \
            -d '{"types":["inventory"]}'

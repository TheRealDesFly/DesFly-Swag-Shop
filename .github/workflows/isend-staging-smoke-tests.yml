name: iSend Staging Smoke Tests

on:
  workflow_dispatch: {}

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests
        env:
          SITE_URL: ${{ secrets['WIX_SITE_BASE_URL'] }}
          POLLER_SECRET: ${{ secrets['ISEND_POLLER_TRIGGER_SECRET'] }}
          WEBHOOK_SECRET: ${{ secrets['ISTORE_ISEND_WEBHOOK_SECRET'] }}
        run: |
          set -euo pipefail
          if [ -z "$SITE_URL" ]; then echo "Missing SITE_URL (WIX_SITE_BASE_URL secret)"; exit 1; fi

          echo "1) testISendLoginFromWix"
          RES=$(curl -s -X GET "$SITE_URL/_functions/testISendLoginFromWix?force=true")
          echo "Login response: $RES"
          OK=$(node -e "try{const r=JSON.parse(process.argv[1]||'{}'); console.log(r.success?1:0);}catch(e){console.log(0)}" "$RES")
          if [ "$OK" -ne 1 ]; then echo "testISendLoginFromWix failed"; exit 1; fi

          echo "2) simulate webhook acceptance"
          PAYLOAD='{"orderNo":"SMOKE-1","tracking":{"trackingNo":"TN-SMOKE-1"}}'
          SIG=$(node -e "const crypto=require('crypto'); const s=process.env.WEBHOOK_SECRET; const p=process.argv[1]; console.log(crypto.createHmac('sha256', s).update(p).digest('hex'))" "$PAYLOAD")
          RES=$(curl -s -X POST "$SITE_URL/_functions/isendWebhook" -H "Content-Type: application/json" -H "X-ISEND-Signature: sha256:$SIG" -d "$PAYLOAD")
          echo "Webhook response: $RES"
          OK=$(node -e "try{const r=JSON.parse(process.argv[1]||'{}'); console.log(r.success?1:0);}catch(e){console.log(0)}" "$RES")
          if [ "$OK" -ne 1 ]; then echo "isendWebhook failed"; exit 1; fi

          echo "3) run poller (tracking/status)"
          RES=$(curl -s -X POST "$SITE_URL/_functions/runISendPoller" -H "Content-Type: application/json" -H "X-ISEND-POLLER-SECRET: $POLLER_SECRET" -d '{"types":["tracking","status"]}')
          echo "Poller response: $RES"
          OK=$(node -e "try{const r=JSON.parse(process.argv[1]||'{}'); console.log(r.success?1:0);}catch(e){console.log(0)}" "$RES")
          if [ "$OK" -ne 1 ]; then echo "runISendPoller failed"; exit 1; fi

          echo "Staging smoke tests passed."
